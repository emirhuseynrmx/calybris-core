version = 1

# Examples, benchmarks and vector generators are illustrative, not shipped
# library surface; style and complexity gates there report noise, not risk.
exclude_patterns = [
  "examples/**",
  "benches/**",
  "bindings/python/examples/**",
]

test_patterns = [
  "**/tests/**",
  "tests/**",
  "fuzz/**",
]

[[analyzers]]
name = "rust"

[[analyzers]]
name = "python"

[[analyzers]]
name = "secrets"
