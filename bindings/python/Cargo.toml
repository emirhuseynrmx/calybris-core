[package]
name = "calybris-core-python"
version = "0.5.7"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Python bindings for the Calybris deterministic decision kernel"
repository = "https://github.com/emirhuseynrmx/calybris-core"
homepage = "https://github.com/emirhuseynrmx/calybris-core"
documentation = "https://docs.rs/calybris-core"
publish = false

[lib]
name = "calybris_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
calybris-core-rs = { package = "calybris-core", path = "../..", version = "0.5.7", default-features = false, features = ["wal", "provenance"] }
ed25519-dalek = "2"
# abi3-py310: build against the CPython stable ABI so ONE wheel per platform
# covers Python 3.10+ — turns a 16-wheel matrix into ~4 and works on future
# CPython releases with no rebuild.
pyo3 = { version = "0.29", features = ["auto-initialize", "abi3-py310", "multiple-pymethods"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
