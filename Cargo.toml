[package]
name = "calybris-core"
version = "1.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Deterministic proof-carrying decision core with replay verification, WAL, and fixed-point budget proofs"
repository = "https://github.com/emirhuseynrmx/calybris-core"
homepage = "https://github.com/emirhuseynrmx/calybris-core"
documentation = "https://docs.rs/calybris-core"
# crates.io gets its own page: README.md leads with the Python decision surface,
# which is the right first thing on GitHub and the wrong first thing for someone
# who just ran `cargo add calybris-core`.
readme = "README-crates.md"
keywords = ["decision-engine", "proof-carrying", "write-ahead-log", "budget-engine", "deterministic"]
categories = ["algorithms", "finance"]
# Published crate is kernel-only: the Python wrapper source and its build
# config live in the repo but do not belong in the crates.io artifact.
exclude = [
  "assets/",
  ".github/",
  "python/",
  "pyproject.toml",
  "scripts/",
  "docs/ENTERPRISE_GAUNTLET.md",
]

[workspace]
members = [".", "bindings/python", "calybris-ffi"]
default-members = ["."]
# The fuzz crate needs nightly and libFuzzer, so it stays out of the workspace
# and out of every ordinary `cargo test` and `cargo build`.
exclude = ["fuzz"]
resolver = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(kani)"] }

[features]
default = ["wal"]
serde = ["dep:serde", "dep:serde_json", "dep:tempfile", "dep:fs2", "dep:file-id"]
wal = ["serde", "dep:hmac", "dep:subtle"]
async = ["wal", "dep:tokio"]
observability = ["dep:tracing"]
provenance = ["dep:ed25519-dalek"]
full = ["wal", "async", "observability", "provenance"]
# Additions that are released but not yet covered by the 1.x stability promise:
# counterfactuals and decision margins, Merkle inclusion and consistency proofs,
# keyed verifiable exploration, off-policy estimates, owned budget
# reservations, and (1.3.0) signed checkpoints, witnesses, audits and
# OpenTimestamps proofs. Each graduates to a stable feature in a later 1.x release once it
# has been reviewed; until then its API may change in a minor release.
# docs/PREVIEW.md says what each one does and what it does not claim.
preview = ["dep:hmac", "provenance", "dep:base64", "dep:ripemd", "dep:getrandom"]
# Ed25519 + ML-DSA-65 (FIPS 204) hybrid signatures over any artifact digest.
# Separate from `preview` because the ML-DSA implementation it pulls in has not
# been independently audited; turn it on knowing that.
preview-pq = ["preview", "provenance", "dep:ml-dsa"]
# RFC 3161 timestamp tokens: build a request, verify a response against a
# pinned TSA certificate. Separate from `preview` because it pulls in X.509,
# CMS and RSA parsing that nothing else needs.
preview-tsa = ["preview", "dep:der", "dep:x509-cert", "dep:cms", "dep:x509-tsp", "dep:spki", "dep:rsa", "dep:p256", "dep:p384"]
# Test-only dependency switch. `cfg(loom)` is enabled separately by
# `CALYBRIS_LOOM=1`, so `--all-features` keeps standard synchronization.
loom-model = ["dep:loom"]

[dependencies]
sha2 = "0.11"
hmac = { version = "0.13", optional = true }
subtle = { version = "2.6", optional = true }
ed25519-dalek = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
ripemd = { version = "0.2", optional = true }
der = { version = "0.7", optional = true, features = ["alloc", "derive", "oid"] }
x509-cert = { version = "0.2", optional = true, default-features = false }
cms = { version = "0.2", optional = true }
x509-tsp = { version = "0.1", optional = true }
spki = { version = "0.7", optional = true }
rsa = { version = "0.9", optional = true, default-features = false, features = ["sha2"] }
p256 = { version = "0.13", optional = true, default-features = false, features = ["ecdsa"] }
p384 = { version = "0.13", optional = true, default-features = false, features = ["ecdsa"] }
ml-dsa = { version = "0.1.1", optional = true, default-features = false, features = ["alloc"] }
file-id = { version = "0.2.3", optional = true }
fs2 = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"], optional = true }
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync"], optional = true }
tracing = { version = "0.1", optional = true }
loom = { version = "0.7", features = ["checkpoint"], optional = true }

# Only the calybris-verify binary reads randomness (new keys, OpenTimestamps
# nonces); the library never does. Kept off wasm32, where getrandom needs a
# backend chosen by the final application, so `preview` still builds there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { version = "0.3", optional = true }

[dev-dependencies]
proptest = "1"
# tests/specification.rs rebuilds every digest layout by hand, so it needs the
# same hash the crate uses rather than the crate's own digest functions.
sha2 = "0.11"
criterion = { version = "5.0.1", package = "codspeed-criterion-compat", features = ["html_reports"] }
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util", "sync"] }

[[bin]]
name = "calybris-verify"
path = "src/bin/calybris_verify.rs"
required-features = ["wal"]

[[example]]
name = "gen_golden_vectors"
path = "examples/gen_golden_vectors.rs"
required-features = ["wal", "provenance"]

[[example]]
name = "gen_conformance_vectors"
path = "examples/gen_conformance_vectors.rs"
required-features = ["wal"]

[[example]]
name = "gen_outcome_vectors"
path = "examples/gen_outcome_vectors.rs"
required-features = ["serde"]

[[example]]
name = "gen_fuzz_seeds"
path = "examples/gen_fuzz_seeds.rs"
required-features = ["wal", "provenance"]

[[example]]
name = "gen_proof_surface_vectors"
path = "examples/gen_proof_surface_vectors.rs"
required-features = ["wal", "provenance"]

[[example]]
name = "trust_costs"
path = "examples/trust_costs.rs"
required-features = ["wal", "preview-pq", "preview-tsa"]

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[example]]
name = "ots_canonical"
required-features = ["preview"]

[[example]]
name = "trust_scale"
required-features = ["preview"]

[[example]]
name = "simple_kernel"
path = "examples/simple_kernel.rs"

[[example]]
name = "verify_wal"
path = "examples/verify_wal.rs"
required-features = ["wal"]

[[example]]
name = "llm_routing"
path = "examples/llm_routing.rs"
required-features = ["wal"]

[[example]]
name = "pretrade_guard"
path = "examples/pretrade_guard.rs"

[[example]]
name = "route_decision"
path = "examples/route_decision.rs"
required-features = ["wal"]

[[example]]
name = "replay_audit"
path = "examples/replay_audit.rs"
required-features = ["wal"]

[[example]]
name = "budget_guard"
path = "examples/budget_guard.rs"

[[bench]]
name = "kernel_bench"
harness = false

[[test]]
name = "audit_pipeline"
path = "tests/audit_pipeline.rs"
required-features = ["wal"]

[[test]]
name = "conformance_proof_surfaces"
path = "tests/conformance_proof_surfaces.rs"
required-features = ["wal", "provenance"]

[[test]]
name = "receipt_pipeline"
path = "tests/receipt_pipeline.rs"
required-features = ["wal", "provenance"]

[[test]]
name = "production_torture"
path = "tests/production_torture.rs"
required-features = ["wal", "provenance"]

[[test]]
name = "budget_loom"
path = "tests/budget_loom.rs"

[[example]]
name = "production_gateway"
path = "examples/production_gateway.rs"
required-features = ["wal", "provenance"]

[[bench]]
name = "budget_bench"
harness = false

[[bench]]
name = "proof_bench"
harness = false
required-features = ["wal", "provenance"]

[profile.release]
lto = true
codegen-units = 1

# The property tests sign and verify tens of thousands of times, and CI runs
# them at 10,000 cases in the test profile. Unoptimized curve arithmetic and
# hashing made that step take half an hour. Only these dependencies are
# optimized; this crate keeps the test profile, so coverage and debug
# assertions are unchanged, and nothing here reaches a crate that depends on
# calybris-core.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
