name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-1.85.0-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --exclude calybris-core-python -- -D warnings

      - name: Build
        run: cargo build --locked --release

      - name: Test (default features)
        run: cargo test --locked --all-features

      - name: Test (no default features)
        run: cargo test --locked --no-default-features

      - name: Test (async feature only)
        run: cargo check --locked --no-default-features --features async

      - name: Test (full features)
        run: cargo test --locked --features full

      - name: Test (workspace, all targets)
        run: cargo test --locked --workspace --all-targets --all-features --exclude calybris-core-python

      - name: Integration audit pipeline
        run: cargo test --locked --test audit_pipeline

  stable:
    name: Stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-stable-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --exclude calybris-core-python -- -D warnings

      - name: Build
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features --exclude calybris-core-python

      - name: Production torture benchmark
        run: >
          cargo test --locked --release --test production_torture --features full --
          --ignored --nocapture --test-threads=1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3ecae7b97ad890c3f3d9020f5e4b25acb2a1d24f # cargo-llvm-cov

      - name: Test with coverage
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Doc
        run: cargo doc --locked --no-deps

      - name: Examples
        run: |
          cargo run --locked --example quickstart
          cargo run --locked --example llm_routing
          cargo run --locked --example pretrade_guard
          cargo run --locked --example route_decision
          cargo run --locked --example replay_audit
          cargo run --locked --example budget_guard
          cargo run --locked --example simple_kernel
          cargo run --locked --example verify_wal
          cargo run --locked --example production_gateway

  python-binding:
    name: Python binding (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Test binding crate
        run: cargo test --locked -p calybris-core-python

      - name: Clippy binding crate
        run: cargo clippy --locked -p calybris-core-python --all-targets -- -D warnings

      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest hypothesis pydantic typing-extensions

      - name: Build wheel
        run: python -m maturin build --release --out dist

      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/calybris-*.whl --force-reinstall

      - name: Import smoke test
        run: |
          python -c "import calybris; import calybris_commerce; import calybris_core; print(calybris.__version__)"

      - name: Python tests
        run: pytest python/tests -q

  python-quality:
    name: Python lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest hypothesis pydantic typing-extensions ruff mypy

      - name: Build and install wheel
        run: |
          python -m maturin build --release --out dist
          python -m pip install dist/calybris-*.whl --force-reinstall

      - name: Ruff
        run: ruff check python/calybris python/calybris_commerce python/tests

      - name: Mypy
        run: mypy python/calybris python/calybris_commerce

      - name: Example smoke tests
        run: |
          python bindings/python/examples/orion_market.py
          python bindings/python/examples/swiftbite_routing.py
          python bindings/python/examples/novamart_benchmark.py --orders 1000
