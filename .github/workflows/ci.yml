name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-1.85.0-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --exclude calybris-core-python -- -D warnings

      - name: Build
        run: cargo build --locked --release

      - name: Test (default features)
        run: cargo test --locked --all-features

      - name: Test (no default features)
        run: cargo test --locked --no-default-features

      - name: Test (async feature only)
        run: cargo check --locked --no-default-features --features async

      - name: Test (full features)
        run: cargo test --locked --features full

      - name: Test (workspace, all targets)
        run: cargo test --locked --workspace --all-targets --all-features --exclude calybris-core-python

      - name: Integration audit pipeline
        run: cargo test --locked --test audit_pipeline

  core-windows:
    name: Core tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.85.0

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-1.85.0-cargo-${{ hashFiles('Cargo.lock') }}

      # Path locking, file identity and symlink privileges differ on Windows, so
      # the core suite runs here too instead of only on Linux.
      - name: Test (workspace, all targets)
        run: cargo test --locked --workspace --all-targets --all-features --exclude calybris-core-python

  stable:
    name: Stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-stable-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --exclude calybris-core-python -- -D warnings

      - name: Build
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features --exclude calybris-core-python

      - name: Production torture benchmark
        run: >
          cargo test --locked --release --test production_torture --features full --
          --ignored --nocapture --test-threads=1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3ecae7b97ad890c3f3d9020f5e4b25acb2a1d24f # cargo-llvm-cov

      - name: Test with coverage
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Doc
        run: cargo doc --locked --no-deps

      - name: Examples
        env:
          CALYBRIS_WAL_HMAC_KEY_HEX: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
          CALYBRIS_RECEIPT_SIGNING_KEY_HEX: 1f1e1d1c1b1a191817161514131211100f0e0d0c0b0a09080706050403020100
        run: |
          cargo run --locked --example quickstart
          cargo run --locked --example llm_routing
          cargo run --locked --example pretrade_guard
          cargo run --locked --example route_decision
          cargo run --locked --example replay_audit
          cargo run --locked --example budget_guard
          cargo run --locked --example simple_kernel
          cargo run --locked --example verify_wal
          cargo run --locked --example production_gateway --features full

  python-binding:
    name: Python binding (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Test binding crate
        run: cargo test --locked -p calybris-core-python

      - name: Clippy binding crate
        run: cargo clippy --locked -p calybris-core-python --all-targets -- -D warnings

      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest hypothesis pydantic typing-extensions

      - name: Build wheel
        run: python -m maturin build --release --out dist

      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/calybris-*.whl --force-reinstall

      - name: Import smoke test
        run: |
          python -c "import calybris; import calybris_commerce; import calybris_core; print(calybris.__version__)"

      - name: Python tests
        # `scripts/tests` covers the release manifests and the source archive. It
        # was never in this command, so a version assertion there could disagree
        # with Cargo.toml without anything reporting it.
        run: pytest python/tests scripts/tests -q

      - name: AgentBudget stress smoke
        timeout-minutes: 5
        run: |
          python -m pip install psutil
          python examples/agent_budget.py
          python scripts/stress_agent_budget.py --steps 100 --workers 8

  python-quality:
    name: Python lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest hypothesis pydantic typing-extensions ruff mypy

      - name: Build and install wheel
        run: |
          python -m maturin build --release --out dist
          python -m pip install dist/calybris-*.whl --force-reinstall

      - name: Ruff
        run: ruff check python/calybris python/calybris_commerce python/tests

      - name: Mypy
        run: mypy python/calybris python/calybris_commerce

      - name: Example smoke tests
        run: |
          python bindings/python/examples/orion_market.py
          python bindings/python/examples/swiftbite_routing.py
          python bindings/python/examples/novamart_benchmark.py --orders 1000

  fuzz:
    name: Fuzz targets (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Every target is built, so a target that stops compiling fails here even
      # if its short run finds nothing.
      - name: Build every target
        run: |
          for target in snapshot_decode receipt_decode wal_decode \
                        outcome_decode policy_decode kernel_decide; do
            cargo fuzz build "$target"
          done

      # Seeded from fuzz/seeds, because an unseeded run spends its whole budget
      # rediscovering the document format. tests/fuzz_seeds.rs checks that each
      # seed really decodes as its target expects.
      - name: Seed the corpora
        run: |
          for dir in fuzz/seeds/*/; do
            target=$(basename "$dir")
            mkdir -p "fuzz/corpus/$target"
            cp "$dir"* "fuzz/corpus/$target/"
          done

      - name: Run each target
        run: |
          for target in snapshot_decode receipt_decode wal_decode \
                        outcome_decode policy_decode kernel_decide; do
            cargo fuzz run "$target" -- -max_total_time=60 -print_final_stats=1
          done

      - name: Keep any crash for inspection
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  determinism:
    name: Determinism (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The layouts are declared little-endian. A big-endian host is the
          # only way to find out whether the code says so or merely inherits it.
          - name: s390x (big-endian)
            target: s390x-unknown-linux-gnu
          - name: aarch64
            target: aarch64-unknown-linux-gnu
          - name: i686 (32-bit)
            target: i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Install cross
        run: cargo install cross --locked

      # The pinned vectors are the determinism claim: these tests assert exact
      # hex, so passing on another architecture is the same statement as
      # "the digests do not depend on the machine".
      - name: Digest and semantics vectors
        run: |
          cross test --target ${{ matrix.target }} --all-features \
            --test specification \
            --test golden_caly_proof \
            --test golden_outcome \
            --test conformance_caly_proof \
            --test conformance_proof_surfaces \
            --test decision_semantics \
            --test outcome_contract

  reproducible:
    name: Reproducible package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.85.0

      # `cargo package` twice from the same commit must produce the same bytes.
      # If it does not, the published artifact is not a function of the source,
      # and nobody downstream can check that what is on crates.io is what is in
      # this repository.
      - name: Package twice and compare
        run: |
          cargo package --locked --allow-dirty --no-verify
          mkdir -p /tmp/first
          cp target/package/*.crate /tmp/first/
          first=$(sha256sum /tmp/first/*.crate | cut -d' ' -f1)

          rm -rf target/package
          cargo package --locked --allow-dirty --no-verify
          second=$(sha256sum target/package/*.crate | cut -d' ' -f1)

          echo "first  $first"
          echo "second $second"
          if [ "$first" != "$second" ]; then
            echo "::error::cargo package is not reproducible from the same source"
            exit 1
          fi

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # The wheel stamps a source digest derived from the git tree. Two builds of
      # the same tree must stamp the same one, or the provenance field is
      # decoration. Rebuilt from scratch, so nothing is carried over in cache.
      - name: The stamped source digest is a function of the source
        run: |
          python -m pip install --quiet maturin
          python -m maturin build --release --out dist-first
          python -m pip install --quiet --force-reinstall --no-deps dist-first/*.whl
          first=$(python -c "import calybris._core as c; print(c.BUILD_SOURCE_DIGEST)")

          rm -rf target/release/build
          python -m maturin build --release --out dist-second
          python -m pip install --quiet --force-reinstall --no-deps dist-second/*.whl
          second=$(python -c "import calybris._core as c; print(c.BUILD_SOURCE_DIGEST)")

          echo "first  $first"
          echo "second $second"
          if [ "$first" != "$second" ]; then
            echo "::error::the stamped source digest is not stable across builds"
            exit 1
          fi
          if [ -z "$first" ]; then
            echo "::error::no source digest was stamped at all"
            exit 1
          fi

      # A clean checkout must report itself clean. If this ever says dirty, the
      # dirty flag is not measuring anything and a release build's identity
      # check would pass on a modified tree.
      - name: A clean checkout stamps clean
        run: |
          dirty=$(python -c "import calybris._core as c; print(c.BUILD_DIRTY)" 2>/dev/null || echo unknown)
          echo "dirty: $dirty"
          if [ "$dirty" = "True" ]; then
            echo "::error::a clean checkout was stamped dirty"
            exit 1
          fi
