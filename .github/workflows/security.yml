name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.170.0

      - name: Rust, Python, secrets, and security audit
        run: >
          semgrep scan
          --config p/rust
          --config p/python
          --config p/secrets
          --config p/security-audit
          --metrics off
          --error
          --exclude target
          .

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-security-${{ hashFiles('Cargo.lock') }}

      - uses: taiki-e/install-action@39a94a55762594a042dd4e34891f325e509fe332 # cargo-audit

      - name: Cargo audit
        run: cargo audit

      - uses: taiki-e/install-action@afc483d62172accfff644fa56e82b4dab50727fc # cargo-deny

      - name: Cargo deny
        run: cargo deny check

  python-security:
    name: Python security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Bandit
        run: bandit -r python/calybris python/calybris_commerce -q

      - name: Python dependency audit
        run: pip-audit . --strict --progress-spinner off

  adversarial:
    name: Extended adversarial tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-adversarial-${{ hashFiles('Cargo.lock') }}

      - name: Proptest (10k cases)
        run: cargo test --locked --all-features
        env:
          PROPTEST_CASES: 10000

      - name: Integration audit pipeline
        run: cargo test --locked --test audit_pipeline

  loom:
    name: Loom budget concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-loom-${{ hashFiles('Cargo.lock') }}

      - name: Loom model tests
        run: cargo test --locked --features loom-model --test budget_loom
        env:
          CALYBRIS_LOOM: "1"
          LOOM_MAX_PREEMPTIONS: 3

  miri:
    name: Miri (UB detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly
          components: miri

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-miri-${{ hashFiles('Cargo.lock') }}

      - name: Miri setup
        run: cargo miri setup

      - name: Miri library tests
        run: >
          cargo miri test --locked --lib --all-features --
          --skip wal::
          --skip async_wal::
          --skip aggressive_mixed_ops_maintain_conservation
          --skip random_ops_maintain_conservation
          --skip builder_prescribe_never_panics
          --skip arbitrary_valid_configs_always_validate
          --skip config_roundtrips_through_builder
          --skip digests_stable_under_repeat
          --skip optimized_scaled_term_matches_i128_reference
          --skip optimized_cost_matches_u128_reference_when_guard_admits
          --skip optimized_kernel_matches_reference_decision
          --skip arbitrary_inputs_never_bypass_provider_fence
          --skip decode_hex32_rejects_non_hex_strings
          --skip prescriptive_kernel
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

      - name: Miri audit pipeline
        run: cargo miri test --locked --test audit_pipeline
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
