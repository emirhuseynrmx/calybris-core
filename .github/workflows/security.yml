name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-security-${{ hashFiles('Cargo.lock') }}

      - uses: taiki-e/install-action@cargo-audit

      - name: Cargo audit
        run: cargo audit

      - uses: taiki-e/install-action@cargo-deny

      - name: Cargo deny
        run: cargo deny check --config deny.toml

  adversarial:
    name: Extended adversarial tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-adversarial-${{ hashFiles('Cargo.lock') }}

      - name: Proptest (10k cases)
        run: cargo test --locked --all-features
        env:
          PROPTEST_CASES: 10000

      - name: Integration audit pipeline
        run: cargo test --locked --test audit_pipeline

  loom:
    name: Loom budget concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-loom-${{ hashFiles('Cargo.lock') }}

      - name: Loom model tests
        run: cargo test --locked --test budget_loom
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: 3

  miri:
    name: Miri (UB detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-miri-${{ hashFiles('Cargo.lock') }}

      - name: Miri setup
        run: cargo miri setup

      - name: Miri library tests
        run: >
          cargo miri test --locked --lib --all-features --
          --skip wal::
          --skip async_wal::
          --skip aggressive_mixed_ops_maintain_conservation
          --skip random_ops_maintain_conservation
          --skip builder_prescribe_never_panics
          --skip arbitrary_valid_configs_always_validate
          --skip config_roundtrips_through_builder
          --skip digests_stable_under_repeat
          --skip optimized_scaled_term_matches_i128_reference
          --skip optimized_cost_matches_u128_reference_when_guard_admits
          --skip optimized_kernel_matches_reference_decision
          --skip arbitrary_inputs_never_bypass_provider_fence
          --skip decode_hex32_rejects_non_hex_strings
          --skip prescriptive_kernel
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

      - name: Miri audit pipeline
        run: cargo miri test --locked --test audit_pipeline
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
