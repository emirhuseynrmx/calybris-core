# Build, verify, attest, and publish the Calybris Python distributions.
#
# The abi3-py310 build emits one wheel per platform for CPython 3.10+.
# Signed, version-matched tag pushes publish automatically. workflow_dispatch
# builds and verifies a release candidate but never publishes it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CALYBRIS_RELEASE_BUILD: "1"

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Validate tag and manifest version contract
        run: python scripts/release_contract.py

      - name: Verify annotated tag signature
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{tag}")
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified')" = "true"

      - name: Install Python release test dependencies
        run: >
          python -m pip install
          maturin==1.14.1
          pytest==9.1.1
          hypothesis==6.156.6
          pydantic==2.13.4
          typing-extensions==4.16.0
          semgrep==1.170.0
          bandit==1.9.4
          pip-audit==2.10.1

      - name: Test release contract
        run: python -m pytest scripts/tests -q

      - uses: taiki-e/install-action@39a94a55762594a042dd4e34891f325e509fe332 # cargo-audit

      - uses: taiki-e/install-action@afc483d62172accfff644fa56e82b4dab50727fc # cargo-deny

      - uses: taiki-e/install-action@39a94a55762594a042dd4e34891f325e509fe332
        with:
          tool: cargo-semver-checks@0.49.0

      - name: Security and patch-SemVer gates on release commit
        run: |
          cargo audit
          cargo deny check
          cargo semver-checks check-release --baseline-version 0.5.5
          semgrep scan --config p/rust --config p/python --config p/secrets --config p/security-audit --metrics off --error --exclude target .
          bandit -r python/calybris python/calybris_commerce -q
          pip-audit . --strict --progress-spinner off

      - name: Rust release gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p calybris-core --all-targets --all-features
          cargo test --locked -p calybris-core-python
          cargo test --locked --release --test production_torture --features full -- --ignored --nocapture --test-threads=1
          cargo package --locked

      - name: Build and test installed release wheel
        run: |
          python -m maturin build --release --locked --out dist
          python -m pip install dist/calybris-*.whl --force-reinstall
          python -m pytest python/tests -q

  sdist:
    name: sdist
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build sdist
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist

  wheels:
    name: wheel ${{ matrix.platform.runner }}-${{ matrix.platform.target }}
    needs: preflight
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { runner: windows-latest, target: x64 }
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  verify:
    name: Verify and attest distributions
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - uses: taiki-e/install-action@39a94a55762594a042dd4e34891f325e509fe332
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Validate distributions and generate provenance
        run: |
          python -m pip install twine==6.2.0
          python -m twine check dist/*
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          python scripts/release_contract.py --source-zip "${RUNNER_TEMP}/calybris-core-${version}-source.zip"
          python scripts/release_contract.py --dist dist --provenance release-metadata/PROVENANCE.json
          mv "${RUNNER_TEMP}/calybris-core-${version}-source.zip" release-metadata/
          cargo cyclonedx -f json --all-features
          mv calybris-core.cdx.json release-metadata/calybris-core.cdx.json
          mv bindings/python/calybris-core-python.cdx.json release-metadata/calybris-python.cdx.json
          sha256sum dist/* release-metadata/* | sort -k2 > release-metadata/SHA256SUMS

      - name: Attest release packages
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: "dist/*"

      - name: Attest release metadata
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: "release-metadata/*"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    if: github.repository == 'emirhuseynrmx/calybris-core' && startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist

  github-release:
    name: Publish GitHub release assets
    needs: verify
    if: github.repository == 'emirhuseynrmx/calybris-core' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release-metadata

      - name: Create release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          release-metadata/*
          --verify-tag
          --generate-notes
